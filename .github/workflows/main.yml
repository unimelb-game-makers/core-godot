name: "Godot CI/CD"

# Configuration required before using this workflow:
# - GODOT_VERSION: Godot version used by the CI container and export templates.
# - PROJECT_NAME: Base name used for build files, artifacts, and Itch.io uploads.
# - PROJECT_PATH: Folder containing project.godot, relative to the repository root.
#   Use '.' when the project is stored at the repository root.
# - ITCH_USERNAME: Account/subdomain name from username.itch.io.
# - ITCH_GAMENAME: URL slug from username.itch.io/game-name.
# - BUILD_PLATFORMS: JSON array of platforms to build in parallel.
# - STEAM_APP_ID: Steam application ID.
# - ITCH_BUTLER_URL: Butler download URL.
#
# Add these GitHub Actions secrets only for the deployment targets you use:
# - Itch.io: ITCH_IO_API_KEY
# - Steam: STEAM_CONFIG_VDF and STEAM_USERNAME
#
# GITHUB_TOKEN, GITHUB_REF, and the `github.*` context values are supplied
# automatically by GitHub Actions and do not need to be created manually.
env:
  GODOT_VERSION: ${{ vars.GODOT_VERSION || '4.4.1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'ci_example' }}
  PROJECT_PATH: ${{ vars.PROJECT_PATH || '.' }}
  ITCH_USERNAME: ${{ vars.ITCH_USERNAME || 'stego-studio' }}
  ITCH_GAMENAME: ${{ vars.ITCH_GAMENAME || 'ci-example' }}
  ITCH_BUTLER_URL: ${{ vars.ITCH_BUTLER_URL || 'https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default' }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  Builds:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: ${{ fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]') }}
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:${{ vars.GODOT_VERSION || '4.4.1' }}
    steps:
      - name: Checkout with Git LFS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
          lfs: true

      - name: Install bundled export templates
        shell: bash
        run: |
          set -euo pipefail
          destination_dir="$HOME/.local/share/godot/export_templates"
          shopt -s nullglob
          source_dirs=(/root/.local/share/godot/export_templates/*.stable)

          if [[ "${#source_dirs[@]}" -eq 0 ]]; then
            echo "The Godot CI container does not contain export templates." >&2
            exit 1
          fi

          mkdir -v -p "$destination_dir"
          cp -a "${source_dirs[@]}" "$destination_dir/"

      - name: Import assets
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          godot --headless --editor --quit-after 2
          godot --import --headless
          # Run a second time to make sure that the warnings have cleared.
          # This should exit pretty much immediately.
          godot --import --headless

      - name: Build ${{ matrix.platform }} export
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            web)
              preset='Web'
              output='build/web/index.html'
              ;;
            windows)
              preset='Windows Desktop'
              output='build/windows/${{ env.PROJECT_NAME }}_windows.exe'
              ;;
            linux)
              preset='Linux/X11'
              output='build/linux/${{ env.PROJECT_NAME }}_linux.x86_64'
              ;;
            macos)
              preset='macOS'
              output='build/macos/${{ env.PROJECT_NAME }}_macos.zip'
              ;;
            *)
              echo 'Unsupported platform: ${{ matrix.platform }}' >&2
              exit 1
              ;;
          esac

          mkdir -v -p "build/${{ matrix.platform }}"
          godot --headless --verbose --export-release "$preset" "$output"

      - name: Add coi-service-worker
        if: matrix.platform == 'web'
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          git clone https://github.com/gzuidhof/coi-serviceworker.git
          mv coi-serviceworker/coi-serviceworker.js build/web/coi-serviceworker.js
          sed -i '3 i <script src="coi-serviceworker.js"></script>' build/web/index.html

      - name: 🚀 Deploy to `gh-pages` branch # Push - deploy to main directory
        if: matrix.platform == 'web' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PROJECT_PATH }}/build/web
          publish_branch: gh-pages
          force_orphan: true
          # NOTE: keeping files like this could be dangerous. Consider deleting stuff to save space if needed, depending on needs
          # e.g. Add an only-keep-last-10-version job
          keep_files: true
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy main branch push to main directory"

      - name: 🚀 Deploy to `gh-pages` branch # PR - deploy to subdirectory
        if: matrix.platform == 'web' && github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PROJECT_PATH }}/build/web
          publish_branch: gh-pages
          force_orphan: true
          keep_files: true
          user_name: "github-ci[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy PR web deploy to subdirectory ${{ github.event.number }}"
          destination_dir: ${{ github.event.number }}

      - name: Upload ${{ matrix.platform }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.PROJECT_PATH }}/build/${{ matrix.platform }}
          if-no-files-found: error

  Github-page-release: # Push only - create github releases
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    needs: [Builds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.15
        with:
          versionSpec: '5.x'

      - name: Execute GitVersion
        uses: gittools/actions/gitversion/execute@v0.9.15
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Get branch name
        id: get_branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: web
          path: artifacts/web

      - name: Package Web release
        run: |
          cd artifacts/web
          zip -q -r "../../${{ env.PROJECT_NAME }}_web.zip" .

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{env.GitVersion_FullSemVer}}
          release_name: ${{env.GitVersion_FullSemVer}}
          body: |
            Release notes for ${{env.GitVersion_FullSemVer}}
          draft: false
          prerelease: true

      - name: Upload Web Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PROJECT_NAME }}_web.zip
          asset_name: "${{ env.PROJECT_NAME }}_web.zip"
          asset_content_type: application/zip
  Deploy:
    name: Deploy selected builds
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [Builds]
    runs-on: ubuntu-latest
    steps:
      - name: Download all selected builds
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Detect deployments and Steam depots
        id: detect
        shell: bash
        env:
          ITCH_IO_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}
          ITCH_USERNAME: ${{ env.ITCH_USERNAME }}
          ITCH_GAMENAME: ${{ env.ITCH_GAMENAME }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
        run: |
          set -euo pipefail

          has_desktop=false
          has_macos=false
          if [[ -d build/windows ]]; then
            echo 'WINDOWS_DEPOT=windows' >> "$GITHUB_ENV"
            has_desktop=true
          fi
          if [[ -d build/linux ]]; then
            echo 'LINUX_DEPOT=linux' >> "$GITHUB_ENV"
            has_desktop=true
          fi
          if [[ -d build/macos ]]; then
            echo 'MACOS_DEPOT=macos' >> "$GITHUB_ENV"
            has_desktop=true
            has_macos=true
          fi

          has_itch=false
          if [[ -n "$ITCH_IO_API_KEY" && -n "$ITCH_USERNAME" && -n "$ITCH_GAMENAME" ]]; then
            has_itch=true
          fi

          has_steam=false
          if [[ "$has_desktop" == "true" && -n "$STEAM_USERNAME" && -n "$STEAM_CONFIG_VDF" && "$STEAM_APP_ID" =~ ^[0-9]+$ ]]; then
            has_steam=true
          fi

          echo "has_itch=$has_itch" >> "$GITHUB_OUTPUT"
          echo "has_steam=$has_steam" >> "$GITHUB_OUTPUT"
          echo "has_macos=$has_macos" >> "$GITHUB_OUTPUT"

      - name: Install Butler
        if: steps.detect.outputs.has_itch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --output butler.zip \
            "${{ env.ITCH_BUTLER_URL }}"
          unzip -q butler.zip
          chmod +x butler

      - name: Deploy selected builds to itch.io
        if: steps.detect.outputs.has_itch == 'true'
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_IO_API_KEY }}
        run: |
          set -euo pipefail
          for folder in build/*; do
            [[ -d "$folder" ]] || continue
            platform="$(basename "$folder")"

            case "$platform" in
              web) channel='html5' ;;
              windows) channel='windows' ;;
              linux) channel='linux' ;;
              macos) channel='macos' ;;
              *) continue ;;
            esac

            echo "Uploading $platform to itch.io channel $channel"
            ./butler push "$folder" "${ITCH_USERNAME}/${ITCH_GAMENAME}:$channel"
          done

      - name: Extract macOS package for Steam
        if: steps.detect.outputs.has_steam == 'true' && steps.detect.outputs.has_macos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/macos/*.zip)
          for archive in "${archives[@]}"; do
            unzip -q "$archive" -d build/macos
            rm "$archive"
          done

      - name: Deploy selected desktop builds to Steam
        if: steps.detect.outputs.has_steam == 'true'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          buildDescription: Auto Steam Deploy ${{ github.sha }}
          rootPath: build
          depot1Path: ${{ env.WINDOWS_DEPOT }}
          depot2Path: ${{ env.LINUX_DEPOT }}
          depot3Path: ${{ env.MACOS_DEPOT }}
         
  PR-comment-update: # PR only - comment preview link
    if: github.event_name == 'pull_request' && contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    needs: [Builds]
    runs-on: ubuntu-latest
    permissions: 
      pull-requests: write
    steps:
      - name: Set preview URL message
        id: set-message
        run: |
          if [[ "${{ needs.Builds.result }}" == "success" ]]; then
            echo "message=🌐 [Web Preview](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.event.pull_request.number }}/)" >> $GITHUB_OUTPUT
          else
            echo "message=❌ Deployment failed for this PR." >> $GITHUB_OUTPUT
          fi

      - name: Comment deploy preview URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.set-message.outputs.message }}
          comment-tag: execution
