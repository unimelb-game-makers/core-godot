name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Validate build configuration
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      desktop_platforms: ${{ steps.platforms.outputs.desktop_platforms }}
      web_enabled: ${{ steps.platforms.outputs.web_enabled }}
      has_desktop: ${{ steps.platforms.outputs.has_desktop }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve build platforms
        id: platforms
        shell: bash
        env:
          BUILD_PLATFORMS: ${{ vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]' }}
          ENABLE_ITCH: ${{ vars.ENABLE_ITCH }}
          ENABLE_STEAM: ${{ vars.ENABLE_STEAM }}
        run: bash .github/scripts/resolve-build-platforms.sh

  build-web:
    name: Build web
    needs: configure
    if: needs.configure.outputs.web_enabled == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_godot-build.yml
    with:
      platform: web
      godot_version: ${{ vars.GODOT_VERSION || '4.7.1' }}
      project_name: ${{ vars.PROJECT_NAME || 'ci_example' }}
      project_path: ${{ vars.PROJECT_PATH || '.' }}

  build-desktop:
    name: Build ${{ matrix.platform }}
    needs: configure
    if: needs.configure.outputs.has_desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.configure.outputs.desktop_platforms) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_godot-build.yml
    with:
      platform: ${{ matrix.platform }}
      godot_version: ${{ vars.GODOT_VERSION || '4.7.1' }}
      project_name: ${{ vars.PROJECT_NAME || 'ci_example' }}
      project_path: ${{ vars.PROJECT_PATH || '.' }}

  publish-preview:
    name: Publish PR preview
    needs: [configure, build-web]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.configure.outputs.web_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/web
          publish_branch: gh-pages
          destination_dir: previews/${{ github.event.pull_request.number }}
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish preview for PR ${{ github.event.pull_request.number }}

  publish-main-pages:
    name: Publish main Pages build
    needs: [configure, build-web]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.configure.outputs.web_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web
          path: build/web

      - name: Publish main build
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/web
          publish_branch: gh-pages
          destination_dir: main
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish main web build

  comment-preview:
    name: Comment preview result
    needs: [configure, publish-preview]
    if: >-
      always() &&
      needs.configure.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.configure.outputs.web_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Set preview message
        id: message
        shell: bash
        env:
          PUBLISH_RESULT: ${{ needs.publish-preview.result }}
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${{ github.event.pull_request.number }}/
        run: |
          if [[ "$PUBLISH_RESULT" == 'success' ]]; then
            echo "message=🌐 [Web Preview](${PREVIEW_URL})" >>"$GITHUB_OUTPUT"
          else
            echo 'message=❌ Web preview publication failed.' >>"$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3
        with:
          message: ${{ steps.message.outputs.message }}
          comment-tag: web-preview
