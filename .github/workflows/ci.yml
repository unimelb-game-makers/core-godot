name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build web
    if: contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    permissions:
      contents: read
    uses: ./.github/workflows/_godot-build.yml
    with:
      platform: web
      godot_version: ${{ vars.GODOT_VERSION || '4.7.1' }}
      project_name: ${{ vars.PROJECT_NAME || 'ci_example' }}
      project_path: ${{ vars.PROJECT_PATH || '.' }}

  build-desktop:
    name: Build ${{ matrix.platform }}
    if: >-
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'windows') ||
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'linux') ||
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'macos')
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]') }}
        exclude:
          - platform: web
    permissions:
      contents: read
    uses: ./.github/workflows/_godot-build.yml
    with:
      platform: ${{ matrix.platform }}
      godot_version: ${{ vars.GODOT_VERSION || '4.7.1' }}
      project_name: ${{ vars.PROJECT_NAME || 'ci_example' }}
      project_path: ${{ vars.PROJECT_PATH || '.' }}

  publish-preview:
    name: Publish PR preview
    needs: build-web
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/web
          publish_branch: gh-pages
          destination_dir: previews/${{ github.event.pull_request.number }}
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish preview for PR ${{ github.event.pull_request.number }}

  publish-main-pages:
    name: Publish main Pages build
    needs: build-web
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-write
      queue: max
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web

      - name: Publish main build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: build/web
          publish_branch: gh-pages
          destination_dir: main
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish main web build

  comment-preview:
    name: Comment preview result
    needs: publish-preview
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON(vars.BUILD_PLATFORMS || '["web","windows","linux","macos"]'), 'web')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Set preview message
        id: message
        shell: bash
        env:
          PUBLISH_RESULT: ${{ needs.publish-preview.result }}
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/${{ github.event.pull_request.number }}/
        run: |
          if [[ "$PUBLISH_RESULT" == 'success' ]]; then
            echo "message=🌐 [Web Preview](${PREVIEW_URL})" >>"$GITHUB_OUTPUT"
          else
            echo 'message=❌ Web preview publication failed.' >>"$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.message.outputs.message }}
          comment-tag: web-preview
