# Secrets: -

name: "Clean the gh-pages branch to save storage space"

on:
  pull_request_target:
    types: [closed]
    
concurrency:
  group: gh-pages-write
  queue: max
  
jobs:
  clean-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove closed PR preview
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-ci[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git rm -r -- "previews/$PR_NUMBER"
          git commit -m "Remove preview for closed PR #$PR_NUMBER"
          git push origin HEAD:gh-pages
